<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5EE" />
    <meta name="description" content="PetLoop 人宠情感闭环系统 — 宠物可穿戴 × 桌面机器人 × 情感计算" />
    <title>PetLoop — 人宠情感闭环系统</title>
    <script>
      // GitHub Pages SPA 404 重定向处理
      // 把原始路径作为p参数传递，然后重定向到index.html
      ;(function (location) {
        var path = location.pathname
        var query = location.search
        var hash = location.hash
        // 重定向到index.html，并把原始路径作为p参数传递
        location.replace('/PetLoop-Design-Portfolio/demo/?p=' + encodeURIComponent(path) + (query ? '&' + query.slice(1) : '') + hash)
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
